  result: 'WAIVED by release lead ([EMAIL_REDACTED]). Build 4.14.0-0.nightly-2026-09-30-024514:
    aggregated=true, accepted=false. 6/6 registry jobs ran (no silent drops). 2 GCP
    jobs failed BO3 0/3 (gcp-ipi-f999, stable-4.14-upgrade-from-stable-4.13-gcp-ipi-f999);
    aws-ipi-disruptive failed first attempt then passed 2/2 (flake). ROOT CAUSE: CI
    tooling, not product. Step cucushift-installer-check-gcp-disktype aborts with
    "gcloud failed to load. You are running gcloud with Python 3.6, which is no longer
    supported by gcloud" - Google Cloud SDK dropped Python 3.6 and the 4.14 branch
    step image still ships it. Cluster install succeeded in every GCP run (ipi-install-install
    succeeded ~33-35m); failure is a post-install disktype validation step. No JUnit
    artifacts produced on GCP (tests never executed), so zero product test scenarios
    failed. AWS and Azure jobs passed with full suites. Waivable: test-infrastructure/tooling
    failure external to the OpenShift payload.'
- name: analyze-promoted-build
  status: Pass
  started_at: '2026-10-01T19:35:59Z'
  completed_at: '2026-10-01T19:35:59Z'
  result: 'WAIVED by release lead ([EMAIL_REDACTED]). Build 4.14.75 (phase=Accepted):
    aggregated=true, accepted=false. 3/3 registry jobs ran (no silent drops). Single
    failing job: stable-4.14-upgrade-from-stable-4.14-gcp-ipi-f999, 0/3 BO3. ROOT
    CAUSE: CI tooling, not product. All 3 attempts die in step cucushift-installer-check-gcp-disktype
    with "gcloud failed to load. You are running gcloud with Python 3.6, which is
    no longer supported by gcloud" - Google Cloud SDK dropped Python 3.6 support and
    the 4.14 branch step image still ships it. Evidence it is not a product defect:
    (1) ipi-install-install succeeded on all 3 attempts (~33-35 min each), cluster
    came up fine; (2) failure is a post-install disktype validation step, not a product
    test; (3) testResultSummary is null on all 3 attempts - no JUnit produced, tests
    never ran, zero scenarios failed; (4) AWS (upgrade-from-4.13-aws-ipi) and Azure
    (upgrade-from-4.14-azure-ipi-fips) jobs both passed first attempt with full suites;
    (5) same signature reproduces on the 4.14.75 candidate build''s GCP jobs. Waivable:
    test-infrastructure/tooling failure external to the OpenShift payload. Follow-up
    (does not block this release): 4.14 branch step image needs CLOUDSDK_PYTHON pointed
    at Python 3.10+ or a newer base image.'
