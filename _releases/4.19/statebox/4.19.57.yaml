- issue: 'take-ownership fails on MCP server: Errata Tool returns "You need Errata
    access for this operation!" when initializing advisories 178069/178070. MCP server
    /health reports kerberos valid, so this is an authorization problem with the server''s
    principal rather than a missing ticket. Verified the same advisories ARE readable
    with the user''s own Kerberos ticket (HTTP 200 from errata.devel.redhat.com/api/v1/erratum/178069
    and /178070), so the advisories are fine. Blocks take-ownership and likely any
    other Errata-backed OAR command run through the MCP server.'
  reported_at: '2026-11-25T10:40:30Z'
  resolved: true
  resolution: 'Worked around by running the command on the local OAR CLI, where the
    user''s Kerberos principal does have Errata access. Ownership is complete and
    independently verified: advisories 178069 and 178070 both show assigned_to=jhuttana@redhat.com
    via the Errata API, the QE release lead comment is on shipment MR 1236, and QE
    Jira subtasks were reassigned. take-ownership is now Pass. NOTE: the underlying
    MCP server defect is NOT fixed - it is tracked by the separate non-blocking issue
    recording the root cause (MCP host authenticates to Errata as machine principal
    errata/vm-10-0-76-71...@IPA.REDHAT.COM, which gets 403). Errata-backed commands
    must keep using the local CLI until that is fixed.'
  blocker: true
  related_tasks:
  - take-ownership
  resolved_at: '2026-11-25T11:31:45Z'
