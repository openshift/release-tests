- issue: 'ROOT CAUSE of MCP Errata failures: the MCP server authenticates to Errata
    Tool as the host/machine principal "errata/vm-10-0-76-71.hosted.upshift.rdu2.redhat.com@IPA.REDHAT.COM"
    (from the host keytab), not as a user/bot account. Errata returns 403 Forbidden:
    "User ''errata/vm-10-0-76-71...'' does not have access." The /health endpoint
    reports kerberos "valid" because it only runs `klist -s`, which proves a TGT exists
    but says nothing about Errata authorization - so health is green while every Errata
    call 403s. Blast radius: ALL Errata-backed OAR commands via MCP (take-ownership,
    check-cve-tracker-bug, push-to-cdn-staging, image-signed-check, change-advisory-status).
    Fix: kinit on the MCP host as a principal that has Errata access, or grant Errata
    access to the machine principal.'
  reported_at: '2026-11-25T11:23:44Z'
  resolved: true
  resolution: 'CORRECTED DIAGNOSIS (not yet fixed - request pending). The earlier
    claim that errata/vm-10-0-76-71...@IPA.REDHAT.COM was "a machine principal never
    provisioned in Errata" was WRONG. It IS a properly registered Errata service account
    - user profile https://errata.engineering.redhat.com/user/3006771 - which has
    been DISABLED, with its QA role marked inactive. That is why Errata returns "does
    not have access" (known but deactivated account) rather than rejecting an unknown
    principal, and why Kerberos auth itself succeeds end to end (the same principal
    authenticates to Brew fine). No new bot account or keytab is required; the existing
    account simply needs re-enabling. Release lead raised a request to re-enable the
    account and reactivate its QA role. IMPORTANT: the QA role specifically must be
    reactivated, not just the account - change-advisory-status needs it to move advisories
    QE -> REL_PREP. Both the MCP host and the replacement VM share this principal,
    so re-enabling fixes both at once.'
  blocker: false
  related_tasks:
  - take-ownership
  - check-cve-tracker-bug
  resolved_at: '2026-11-25T13:16:28Z'
