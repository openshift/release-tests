  result: 'OVERRIDE by release lead ([EMAIL_REDACTED]), 2026-11-25. QE f999 blocking
    jobs show 9/9 failures, but this is a qe-private-deck CI infrastructure outage,
    not a payload defect. Evidence: (1) Release Controller independently verified
    4.19.57 on public Prow in the same window - blocking jobs upgrade + upgrade-minor
    both Succeeded, 11/12 informing jobs Succeeded (incl. aws-ovn-upgrade-fips, gcp-ovn-rt-upgrade-minor,
    metal-ipi-ovn-ipv4/ipv6, hypershift conformance, microshift conformance, fips-scan);
    build phase = Accepted. (2) Sole informing failure azure-ovn-upgrade-4.19-micro
    is the known flake tracked in TRT-3116. (3) The f999 failures are cross-version
    (4.21.44 identical signature), cross-platform, and span all job types incl. fresh
    install - impossible for a single-payload regression. (4) Root cause: credential
    rotation in openshift-ci-private - the qe-private-deck service account key is
    revoked (invalid_grant: Invalid JWT Signature), which also blocks local artifact
    reads. Decision: payload is healthy per independent verification; proceed with
    release workflow. f999 outage tracked separately for TRT/DPTP.'
