- issue: 'ROOT CAUSE of MCP Errata failures: the MCP server authenticates to Errata
    Tool as the host/machine principal "errata/vm-10-0-76-71.hosted.upshift.rdu2.redhat.com@IPA.REDHAT.COM"
    (from the host keytab), not as a user/bot account. Errata returns 403 Forbidden:
    "User ''errata/vm-10-0-76-71...'' does not have access." The /health endpoint
    reports kerberos "valid" because it only runs `klist -s`, which proves a TGT exists
    but says nothing about Errata authorization - so health is green while every Errata
    call 403s. Blast radius: ALL Errata-backed OAR commands via MCP (take-ownership,
    check-cve-tracker-bug, push-to-cdn-staging, image-signed-check, change-advisory-status).
    Fix: kinit on the MCP host as a principal that has Errata access, or grant Errata
    access to the machine principal.'
