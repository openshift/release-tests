issues:
- issue: 'CI-wide blocking-test outage since 2026-11-24: 100% failure rate (9/9 attempts)
    on all 3 blocking jobs for promoted build 4.19.57 (upgrade-from-4.18-aws-ipi,
    upgrade-from-4.19-azure-ipi-fips, upgrade-from-4.19-gcp-ipi). Same signature on
    candidate build 4.19.0-0.nightly-2026-11-24-024702 and on unrelated release 4.21.44
    (started 2026-11-24T20:29Z). Later 4.19 nightlies (11-24-144702, 11-25-024702)
    also fail 100% across fresh install, FIPS, disruptive and upgrade jobs. Last clean
    run was 4.19.56 (2026-11-13, all 3 jobs passed first try). Cross-version + cross-platform
    + all job types = CI infrastructure/harness failure, NOT a 4.19.57 payload regression.
    Consequence: there is NO valid QE test signal for this build - failures cannot
    simply be waived. Needs TRT/DPTP escalation.'
