issues:
- issue: 'CI-wide blocking-test outage since 2026-11-24: 100% failure rate (9/9 attempts)
    on all 3 blocking jobs for promoted build 4.19.57 (upgrade-from-4.18-aws-ipi,
    upgrade-from-4.19-azure-ipi-fips, upgrade-from-4.19-gcp-ipi). Same signature on
    candidate build 4.19.0-0.nightly-2026-11-24-024702 and on unrelated release 4.21.44
    (started 2026-11-24T20:29Z). Later 4.19 nightlies (11-24-144702, 11-25-024702)
    also fail 100% across fresh install, FIPS, disruptive and upgrade jobs. Last clean
    run was 4.19.56 (2026-11-13, all 3 jobs passed first try). Cross-version + cross-platform
    + all job types = CI infrastructure/harness failure, NOT a 4.19.57 payload regression.
    Consequence: there is NO valid QE test signal for this build - failures cannot
    simply be waived. Needs TRT/DPTP escalation.'
  reported_at: '2026-11-25T10:40:20Z'
  resolved: true
  resolution: 'CORRECTION + release lead decision. The original claim "there is NO
    valid QE test signal" was WRONG and is retracted: independent test signal does
    exist. The Release Controller verified 4.19.57 on PUBLIC Prow during the same
    window - blocking jobs upgrade and upgrade-minor both Succeeded, and 11/12 informing
    jobs Succeeded (aws-ovn-upgrade-fips, gcp-ovn-rt-upgrade-minor, metal-ipi-ovn-ipv4,
    metal-ipi-ovn-ipv6, hypershift conformance, microshift conformance+serial, aws-ovn-serial,
    driver-toolkit, fips-scan, single-node-upgrade); build phase = Accepted. The one
    informing failure, azure-ovn-upgrade-4.19-micro, is the known flake in TRT-3116.
    Scope corrected: the outage is confined to the qe-private-deck / openshift-ci-private
    f999 track, not CI-wide and not the payload. Release lead jhuttana@redhat.com
    authorised proceeding on 2026-11-25. analyze-promoted-build and analyze-candidate-build
    set to Pass with override rationale. The f999 outage itself is still open and
    needs TRT/DPTP follow-up (likely the same openshift-ci-private credential rotation
    that revoked the qe-private-deck GCS key) - tracked by the separate non-blocking
    GCS_CRED_FILE issue.'
