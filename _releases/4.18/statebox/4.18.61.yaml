- name: analyze-promoted-build
  status: In Progress
  started_at: '2026-11-26T11:55:58Z'
  completed_at: null
  result: |-
    HELD BY RELEASE LEAD pending log access (decision 2026-11-26). Do NOT waive until qe-private-deck build logs are read and root cause is confirmed.

    FINDINGS. 4.18.61: aggregated=true, accepted=false. All 3 QE blocking jobs failed 0/3 BO3 (9/9 attempts): upgrade-from-stable-4.17-aws-ipi, upgrade-from-stable-4.18-azure-ipi-fips, upgrade-from-stable-4.18-gcp-ipi. Zero JUnit artifacts on any attempt.

    Note on method: absence of testResultSummary is not by itself evidence of early job death - passing z-streams (4.15.69, 4.17.57, 4.20.30) also lack the field. Validated baseline: among FAILED jobs the field IS populated when JUnit exists (4.19 nightly 2026-11-24-024702 has 4/6 failed jobs with summaries). So for these failed jobs, absence does mean no JUnit was produced.

    Cross-release temporal correlation: three independent z-streams whose jobs ran 2026-11-25 failed 100% with zero JUnit across aws/azure/gcp - 4.12.104, 4.18.61, 4.19.57. Every z-stream whose jobs ran earlier passed 100% - 4.15.69 (Sep), 4.17.57 (Aug), 4.20.30 (Jul).

    Payload-health counter-evidence: Release Controller blocking jobs for 4.18.61 (upgrade, upgrade-minor) both Succeeded on public Prow, exercising the real upgrade path. Failures confined to qe-private-deck fleet.

    Nuance against a pure template/setup failure: runtimes were long (aws ~48-67min, gcp ~57min, azure-fips 3h12m-3h33m), so jobs ran substantially before failing.

    BLOCKED ON: cannot read Prow artifacts. GCS_CRED_FILE unset; [EMAIL_REDACTED] has no storage.objects.get on gs://qe-private-deck (403); deck UI 403 unauthenticated. Needed to resume: a GCS service-account credentials file with qe-private-deck read access, or logs supplied by ART/CI. Then inspect build-log.txt for the 3 failed jobs to confirm infra vs product.

    Working hypothesis if logs confirm: QE CI infrastructure failure, waivable. Confidence medium-high but UNCONFIRMED.
