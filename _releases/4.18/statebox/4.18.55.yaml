    API (access.redhat.com/hydra/rest/securitydata/cve/CVE-2026-33814.json): 261 shipped
    fixes portfolio-wide, ZERO for OpenShift 4.18 (4.12=5, 4.14=7, 4.15=1, 4.16=18,
    4.17=15, 4.19=24, 4.20=23, 4.21=31, 4.22=37). package_state lists openshift4/ose-telemeter-rhel9
    as fix_state=Affected. Only shipped telemeter fix is 4.12 (RHSA-2026:59833); only
    azure-kms fix is 4.22 (RHSA-2026:63096); neither backported to 4.18. Both components
    appear in rebuiltImages for 4.18.54->4.18.55, but that is the routine blanket
    rebuild (160 of ~178 payload images) and carries no CVE signal. ~50 sibling CVE-2026-33814
    trackers for 4.18 payload components remain New/ASSIGNED/ON_QA with go-stdlib:blocked,
    indicating the 4.18 Go stdlib remediation is blocked as a whole; the Verified
    flips on 103347/103536 around 2026-09-09/10 were premature Jira state, not shipped
    builds. Confirmed with ART in Slack 2026-09-16 (gparente: "Let''s unblock releases
    and QE in the best manner"). Defer to a later 4.18.z once the patched Go toolchain
    is adopted.'
