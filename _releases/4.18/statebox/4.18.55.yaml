  result: |-
    Re-checked 2026-09-13. Of 9 flagged: 7 are false positives, 2 are real.

    FALSE POSITIVE (7) — already covered on advisory 172680 by ose-rhel-coreos-9 counterparts with identical CVE + flaw UUID. Pairs (missed = attached, CVE): 84265=113123 CVE-2026-6893; 86079=113018 CVE-2026-5946; 86100=113087 CVE-2026-3039; 94064=112938 CVE-2026-14164; 98975=112962 CVE-2026-15816; 99326=114048 CVE-2026-13321; 99467=114380 CVE-2026-11331. Root cause: advisory.py:274 compares Jira keys literally, no CVE/flaw dedup, so rhcos-keyed duplicates read as missing. No action needed.

    REAL (2) — OCPBUGS-103347, 103536. CVE-2026-33814 Go HTTP/2 DoS; components azure-kms-encryption-provider-rhel9, ose-telemeter-rhel9. Confirmed 0 matches on either advisory (172680, 172782). Verified 2026-09-10, after content cut (candidate nightly 2026-09-07), so fix likely not in the 4.18.55 payload. Proposed: defer to 4.18.56, pending ART confirmation that the fixed builds are absent.
