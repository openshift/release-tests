- name: check-cve-tracker-bug
  status: Pass
  started_at: '2026-09-11T05:30:18Z'
  completed_at: '2026-09-07T18:45:44Z'
  result: |-
    9 flagged, none actionable for 4.18.55.

    7 false positives: duplicates already on advisory 172680 via ose-rhel-coreos-9 counterparts (same CVE + flaw UUID). advisory.py:274 / shipment.py:1548 compare Jira keys literally with no CVE/flaw dedup.

    2 out of scope: OCPBUGS-103347, 103536 (CVE-2026-33814). Assembly basis time is 2026-09-07T18:45:44Z; both went Verified 2026-09-10 (12:32:51Z, 13:07:33Z), i.e. after the content cut, so not eligible for this assembly. ART confirmed 2026-09-17 (gparente): "both trackers should not be included in 4.18.55 advisory." Roll to 4.18.56.

    Root cause of the alarm: ERT runs `elliott find-bugs --cve-only` (no basis-time cutoff); ART runs find-bugs:sweep (applies get_sweep_cutoff_timestamp + filter_bugs_by_cutoff_event). Any tracker verified post-cut always flags for ERT, never for ART. Recurs until ERT compares Verified time against basis time.
