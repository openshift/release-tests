- name: analyze-candidate-build
  status: Pass
  started_at: '2026-10-30T17:13:07Z'
  completed_at: '2026-11-02T06:49:38Z'
  result: |-
    Candidate build 4.21.0-0.nightly-2026-10-28-231847 (amd64): NOW accepted=true, aggregated=true. WAIVER SUPERSEDED BY REAL GREEN SIGNAL - no waiver is being relied upon.

    ORIGINAL STATE (2026-10-30): accepted=false. 5/6 blocking jobs passed first attempt. One job failed BO3 0/3: periodic-ci-...-stable-4.21-upgrade-from-stable-4.20-gcp-ipi-f999 (minor upgrade 4.20->4.21, GCP). Root cause identical on all 3 attempts: ipi-install-install failed after ~3min on 'failed to set IAM policy: googleapi: Error 400: The number of members in the policy (1,504 / 1,502) is larger than the maximum allowed size 1,500'. CI GCP project IAM policy hit Google's hard 1,500-member ceiling from leaked bindings. Cluster never provisioned; zero test code executed. Initially accepted with an infrastructure waiver by release lead [EMAIL_REDACTED], with a carry-forward caveat that GCP minor-upgrade coverage was absent.

    RESOLUTION (2026-10-31): Rather than rely on the waiver, both failed retry slots were re-run via 'job run --upgrade_to' (correct for upgrade jobs; sets RELEASE_IMAGE_TARGET only). New job IDs 78794450-15ce-4882-a5d5-fa379bf68b21 and 65009057-a770-4bb2-851a-a7dd2147fc1c were swapped in via jobctl update-retried-job-run, which also popped aggregated/accepted so the VM aggregator would reprocess. BOTH RE-RUNS SUCCEEDED, meeting the BO3 threshold of 2 over 2 retry slots, and the build flipped to accepted=true.

    VERIFIED DIRECTLY FROM JUNIT ARTIFACTS: cucushift-upgrade-toimage 36 tests / 0 failures; cucushift-upgrade-rhel-worker 35 tests / 0 failures. Genuine 4.20->4.21 upgrade on GCP with all cluster operators upgrading successfully. (testResultSummary reads null in the result file - a known aggregator quirk for manually swapped retry slots - but the underlying artifacts are green.)

    CARRY-FORWARD CAVEAT IS CLOSED. The GCP minor-upgrade path has real passing coverage. Nothing here blocks final approval.
