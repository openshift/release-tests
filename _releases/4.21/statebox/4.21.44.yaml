- name: analyze-candidate-build
  status: Pass
  started_at: '2026-11-27T07:34:32Z'
  completed_at: '2026-11-27T07:34:32Z'
  result: |-
    PASS ON DOCUMENTED WAIVER - decided by release lead 2026-11-27. Candidate build 4.21.0-0.nightly-2026-11-24-093421 (aggregated=true, accepted=false). All 18 attempts (6 blocking jobs x 3 BO3) failed; verified every one directly from GCS via junit_operator.xml plus per-step junit. Zero product defects found.

    THREE FAILURE CATEGORIES:
    (A) Boskos lease exhaustion - 12 of 18 attempts. 'failed to acquire lease for "<cloud>-autorelease-qe-quota-slice": resources not found', dying at ~122m. No steps ran, no tests executed. Pure CI infra.
    (B) send-results-to-reportportal - 6 of 18 attempts, the sole job-failing step. Data Router shut down 2026-11-18 (RHIDP-18186); credential /var/run/datarouter/gcs_sa_openshift-ci-private is permanently dead. Tracked in OCPQE-32124. Tests underneath fully green.
    (C) fips-check-node-scan - reports a junit failure in all 5 install-type runs, but the step's own finished.json is passed=true/SUCCESS so it never affected any job verdict. Substance: conmon-rs (/usr/bin/conmonrs) 'rust binary lacks a cargo-auditable manifest; bundled crypto cannot be ruled out', status=warning, overall 'Successful run with warnings'. The testcase asserts warnings-as-failure. Test-automation strictness, not a product defect - but it is a genuine FIPS-scan blind spot on a Rust binary and identical across aws/azure-fips/gcp because it is the same payload.

    COVERAGE OBTAINED:
    - gcp-ipi-f999: 3 of 3 executed, green
    - aws-ipi-f999: 1 of 3 executed (2125629708073701376), green
    - azure-ipi-fips-f999: 1 of 3 executed (2125578819451490304), green
    - stable-4.21-upgrade-from-stable-4.20-gcp-ipi-f999: 1 of 3 executed (2125578887562792960), 71 tests / 0 failures (cucushift-upgrade-rhel-worker 35, cucushift-upgrade-toimage 36)

    KNOWN GAP - WAIVED WITHOUT TEST DATA:
    - aws-ipi-disruptive-f999: 0 of 3 attempts executed (all Boskos-starved). No test data for this nightly, and no equivalent green run elsewhere for 4.21.44 - the promoted-build job set was the three upgrade jobs only.
    - stable-4.21-upgrade-from-stable-4.21-aws-ipi-f999: 0 of 3 attempts executed (all Boskos-starved). No test data for this nightly. Nearest coverage is the promoted build's stable-4.21-upgrade-from-stable-4.20-aws-ipi-f999 re-run 2125886880154128384 (73 tests / 0 failures), which is the same platform and upgrade family but a different source version.

    RATIONALE FOR WAIVING THE GAP: this candidate nightly is superseded. 4.21.44 is already promoted (phase Accepted), its promoted build was analysed and waived on 2026-11-26 with every blocking job having at least one fully green execution, and manual_promotion was applied so the releasepayload carries release.openshift.io/qe_state=Accepted. Candidate-build analysis is informational and does not gate the release. Re-running a superseded nightly was judged not worth several hours. This is a deliberate departure from the standard applied to the promoted build on 2026-11-26, where absence of data was explicitly NOT waived; recorded here so the difference is visible in audit.
