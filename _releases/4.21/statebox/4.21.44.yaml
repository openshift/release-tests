- name: analyze-promoted-build
  status: Pass
  started_at: '2026-11-26T04:58:48Z'
  completed_at: '2026-11-26T13:23:37Z'
  result: |-
    PASS ON DOCUMENTED WAIVER - decided by release lead (jhuttana) 2026-11-26.

    Original state: aggregated=true, accepted=false. Two infra failure modes, zero product failures:
    (A) Boskos lease exhaustion - runs died at exactly 7200s with 'failed to acquire lease for "<cloud>-autorelease-qe-quota-slice": resources not found'; zero tests executed.
    (B) send-results-to-reportportal - Data Router was SHUT DOWN 2026-11-18 (RHIDP-18186); DNO ReportPortal sunset 2026-11-27. The step still runs 'gcloud auth activate-service-account --key-file /var/run/datarouter/gcs_sa_openshift-ci-private', retries 10x/2min, then fails the pod after ~23min. Not best-effort, so the whole job is marked FAILURE with all tests green. Affects every automated-release f999 job on 4.18/4.19/4.20/4.21, both clouds. Filed OCPQE-32124 (Bug, Critical) to remove the step. The credential will never be restored - the service is decommissioned.

    Gap closure: the AWS 4.20->4.21 upgrade job originally had ZERO test coverage (all 3 runs lease-starved), so the build was NOT waived on absence of data. Boskos recovered, and 4 re-runs were triggered 2026-11-26 09:38-09:39Z via 'job run --upgrade_to quay.io/openshift-release-dev/ocp-release:4.21.44-x86_64'.

    Final evidence - every blocking job now has at least one fully green execution:
    - stable-4.21-upgrade-from-stable-4.20-aws-ipi-f999: re-run 2125886880154128384 = 73 tests, 0 failures, 0 errors (cucushift-upgrade-rhel-worker 35, cucushift-upgrade-toimage 37, aws-deprovision-verification 1). Previously-missing coverage now obtained and green.
    - stable-4.21-upgrade-from-stable-4.21-gcp-ipi-f999: re-runs 2125887147096412160 and 2125887155082366976 = 71 tests each, 0 failures.
    - stable-4.21-upgrade-from-stable-4.21-azure-ipi-fips-f999: 3 original runs, 71 tests each, 0 failures.

    In every run the sole failing step per finished.json is send-results-to-reportportal. No product defect found anywhere.

    Action: jobctl promote-test-results --build 4.21.44 executed, setting manual_promotion=true so the aggregator applies release.openshift.io/qe_state=Accepted to the releasepayload. accepted stays false in the result file because the aggregator derives it from job state, which is poisoned by the dead reportportal step; the manual promotion is the designed bypass for exactly this case.
