issues:
- issue: 'MCP server host lacks Errata authorization. The server (vm-10-0-76-71.hosted.upshift.rdu2.redhat.com)
    authenticates to Errata Tool as host service principal ''errata/vm-10-0-76-71.hosted.upshift.rdu2.redhat.com@IPA.REDHAT.COM'',
    which has no Errata access (HTTP 403 Forbidden). This blocks all Errata-dependent
    tasks: take-ownership, check-cve-tracker-bug, push-to-cdn-staging, image-signed-check,
    change-advisory-status. Advisories 178067/178068 are readable with a normal user
    Kerberos ticket, confirming this is a service-principal provisioning gap, not
    a release-data problem. Fix: grant Errata access to the server principal via https://redhat.service-now.com/help?id=rh_search&q=errata%20tool&ct=sc,
    or configure the MCP server to use a provisioned user/service keytab.'
