- name: analyze-promoted-build
  status: Pass
  started_at: '2026-10-30T11:07:48Z'
  completed_at: '2026-10-30T11:07:48Z'
  result: |-
    Waivable CI infrastructure failures accepted by release lead ([EMAIL_REDACTED]) 2026-10-30.

    accepted=false driven by a single job failing BO3: periodic-ci-openshift-openshift-tests-private-release-4.20-automated-release-stable-4.20-upgrade-from-stable-4.19-aws-ipi-f999 (first=failure, retries=[success, failure]; threshold round((2+1.1)/2)=2, successes=1). Other 2 blocking jobs (upgrade-from-stable-4.20 azure-ipi-fips, upgrade-from-stable-4.20 gcp-ipi) passed on first attempt.

    ROOT CAUSE - broken CI build-farm node, not a product defect. Both failed attempts failed in "Run multi-stage test pre phase" with pods stuck Pending >1h and never starting containers (PodInitializing), both scheduled onto the SAME node ip-10-28-64-62.us-east-2.compute.internal:
    - attempt 1 (run 2116010594124435456, 2h31m): pod aws-ipi-f999-cucushift-installer-check-fips; kubelet "Failed to create pod sandbox: DeadlineExceeded" x9 and "RST_STREAM/CANCEL" x4; ns ci-op-i6r208jy
    - attempt 3 (run 2116056812628217856, 1h15m): pod aws-ipi-f999-ipi-conf-aws-byo-ipv4-pool-public; kubelet "RST_STREAM/CANCEL" x4 and "DeadlineExceeded" x6; ns ci-op-xh0b8vq4

    EVIDENCE OF NON-PRODUCT NATURE: containers never started so zero product code ran; testResultSummary is null on all three attempts; both failures are in the pre/setup phase before the upgrade under test began; the successful retry (run 2116056790952054784, 2h59m) completed the full 4.19->4.20 AWS upgrade on this payload.

    FOLLOW-UP: report node ip-10-28-64-62.us-east-2.compute.internal to DPTP/test-platform - its CRI-O/kubelet cannot create pod sandboxes and it will keep poisoning jobs until drained.
