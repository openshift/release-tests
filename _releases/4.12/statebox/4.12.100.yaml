issues:
- issue: check-cve-tracker-bug crashes in elliott (ART-side bug, not a CVE finding).
    elliottlib/shipment_utils.py:243 get_bug_ids_from_open_shipment_mrs scans ALL
    open ocp-shipment-data MRs, calls get_shipment_configs_from_mr(mr.web_url) ->
    artcommonlib/gitlab.py:75 projects.get(), raising GitlabHttpError 404 Project
    Not Found on one MR whose source project the service account cannot resolve (likely
    a fork; GitLab returns 404 for invisible projects). No guard, so one unreadable
    MR aborts the sweep. Reproduced twice (09:00:35Z, 09:03:19Z), identical signature
    - deterministic. NOT specific to 4.12.100; affects any release until that MR closes
    or elliott is patched. The Jira sweep itself completed (basis 2026-10-06 00:20:05
    UTC, brew event 69052798, 16/18 VERIFIED bugs qualified, 3 filtered as attached
    elsewhere) but died before reporting missed trackers. CVE coverage for 4.12.100
    is UNVERIFIED - needs manual check before final approval. Task is non-blocking
    by design.
  reported_at: '2026-10-08T09:04:31Z'
  resolved: true
  resolution: 'Resolved 2026-10-12 07:18 UTC. The elliott GitLabHttpError 404 was
    transient, not permanent: it was caused by a third-party open ocp-shipment-data
    MR whose source project the service account could not resolve, and that MR has
    since closed. Re-ran check-cve-tracker-bug successfully - full sweep completed
    in ~90s, processed MR 935, result: "no new CVE tracker bug found in either advisories
    or shipments". Task is now Pass. CVE coverage for 4.12.100 is VERIFIED clean;
    the earlier "UNVERIFIED - needs manual check before final approval" note no longer
    applies.'
  blocker: false
