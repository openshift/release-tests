- name: analyze-candidate-build
  status: Pass
  started_at: '2026-08-31T08:45:25Z'
  completed_at: '2026-08-31T08:45:25Z'
  result: |-
    Candidate build 4.12.0-0.nightly-2026-08-24-203447 (amd64): aggregated=true, accepted=false. WAIVED — RECOMMEND ACCEPT (HIGH confidence). Independently verified from raw test-result JSON + live Jira.

    BO3 outcome: 5 blocking jobs — 3 fresh-install FAILED 0/3 (aws-ipi, azure-ipi-fips, gcp-ipi-custom-type), 2 upgrade jobs PASSED (upgrade-from-stable-4.12-aws-ipi, upgrade-from-stable-4.12-gcp-ipi-custom-type).

    Root cause: The ONLY functional failures are 2 identical sig-netobserv LEVEL0 tests on every attempt that reached the test stage, on all 3 platforms:
      - OCP-54043/OCP-66031 (processor.metrics.TLS==Auto): Verify flowlogs-pipeline and Console metrics [Serial]
      - OCP-50504 (processor.metrics.TLS==Disabled): Verify flowlogs-pipeline metrics and health [Serial]
    All other tests pass everywhere: openshift-extended-test 51/54, cucushift-e2e 24/24. Reported failures=3 = 2 named scenarios + 1 associated netobserv setup failure (same root cause). The extra retry "no results" failures (aws retry1/2, azure retry1, gcp retry1/2) are unrelated cluster install/infra failures with no JUnit output — they only prevented BO3 recovery.

    Classification: Known QE test-automation issue, NOT a product bug, NOT backported to release-4.12. Verified live in Jira:
      - ACTIVE: OCPQE-32102 (Code Review, updated 2026-08-29, owner memodi@) — identical cases 50504/54043/66031/72959 on 4.13, fix in progress.
      - 4.12-specific closed trackers for case 54043: OCPQE-26332, OCPQE-26147 (aws), OCPQE-25544 (azure).
      - Broader history: OCPQE-26976/27621/27977/28274/28784 (4.15/4.16/4.17), all owned by netobserv QE (memodi@, aramesha@).
      - Product bug check: OCPBUGS search for these netobserv metrics failures found NO matching product bug (only unrelated Closed console bug OCPBUGS-86280).

    Reproducible, not flaky: azure-ipi-fips retry 2 re-ran the full suite and failed the identical netobserv cases again — confirms deterministic automation failure isolated to the netobserv layered operator, not the core payload.

    Follow-up (non-blocking): consider filing/linking an OCPQE tracker for 4.12.97 mirroring OCPQE-32102 and notifying netobserv QE owners ([EMAIL_REDACTED], [EMAIL_REDACTED]). Reference doc: 4.12.97-candidate-build-analysis.md.
