- name: analyze-promoted-build
  status: Pass
  started_at: '2026-09-29T05:49:31Z'
  completed_at: '2026-09-29T05:52:58Z'
  result: |-
    Promoted build 4.12.99 (amd64): aggregated=true, accepted=false. 2/3 blocking jobs passed BO3 (aws-ipi upgrade, gcp-ipi-custom-type upgrade both first-attempt success); 1 failed 0/3: upgrade-from-stable-4.12-azure-upi.

    WAIVED by release lead. CONFIRMED known Azure UPI infrastructure issue (not a product regression). Fix raised in openshift/release PR #85750: https://github.com/openshift/release/pull/85750

    Supporting evidence: (1) failure isolated to the azure-upi variant - aws-ipi and gcp-ipi-custom-type upgrade jobs both green on first attempt, no cross-platform signal; (2) all 3 azure-upi attempts produced NO testResultSummary, indicating the jobs died before test execution began (install/provisioning failure signature); (3) each attempt ran only ~13-14 min (first 13:28:01-13:41:49Z; retries 14:25:20-14:39:25Z and 14:25:26-14:39:15Z), far too short for an upgrade+e2e run - an infra abort during provisioning; (4) both retries launched 6 seconds apart, so all attempts sampled the same Azure UPI provisioning window; (5) consistent with the candidate build, whose only failures were similarly-shaped platform infra failures (GCP), also waived.

    Confidence: High - release lead confirmed this is a known infra issue with a fix in flight (PR #85750). (Note: raw install logs in gs://qe-private-deck were not read directly because gsutil required reauthentication, but the known-issue confirmation supersedes that gap.)

