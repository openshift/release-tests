- name: stage-testing
  status: Pass
  started_at: '2026-08-18T07:13:05Z'
  completed_at: '2026-08-19T06:30:25Z'
  result: |-
    Stage-testing PASSED with waiver for LocalStorage tests on Azure UPI.

    Builds #1747 and #1748 both provisioned clusters successfully and passed 9/10 test jobs. Only failures were LocalStorage Cucumber tests:

    - OCP-31437: Storage Stage LocalVolume can be used by deployment
    - OCP-35943: Storage Stage PV is provisioned by Localvolumeset
    - Error: "pattern not found: local-pv-*" — LocalStorage provisioner unable to discover PVs on Azure UPI Standard_D4s_v3 worker nodes.

    Root cause: Azure UPI environment limitation — local disk provisioner does not find eligible disks on these instance types. Not a product bug.

    All other tests passed: non-admin runners (3/3), normal ginkgo, admin runners (2/3), destructive runner, disruptive ginkgo — covering networking, descheduler, cluster-capacity, and E2E scenarios.

    Waiver approved by release lead.

    Jenkins links:
    - #1747: https://jenkins-csb-openshift-qe-mastern.dno.corp.redhat.com/job/zstreams/job/Stage-Pipeline/1747/
    - #1748: https://jenkins-csb-openshift-qe-mastern.dno.corp.redhat.com/job/zstreams/job/Stage-Pipeline/1748/

    Note: Builds #1743-#1746 failed on Azure UPI Flexy-install (infrastructure provisioning failures, not test failures).
- name: analyze-candidate-build
  status: Pass
  started_at: '2026-08-17T14:29:50Z'
  completed_at: '2026-08-17T14:29:50Z'
  result: |-
    All failures waivable — no product bugs detected.

    1. sig-netobserv (OCP-50504/54043/66031/72959): Known QE automation issue — FlowCollector status exact-match bug on release-4.13 (fixed in 4.16+ but not backported). Tracker: OCPQE-32102. Fails consistently on all platforms (AWS/Azure/GCP).

    2. Upgrade jobs (4.12->4.13, 4.13->4.13): ReportPortal datarouter.ccitredhat.com 503 — temporary infra issue confirmed by CI team in Slack.

    3. Logging OCP-43443 (Fluentd Cloudwatch): Single flaky occurrence (1/3 runs, AWS only). Not seen on Azure or GCP.
- name: analyze-promoted-build
  status: Pass
  started_at: '2026-08-19T06:33:23Z'
  completed_at: '2026-08-19T06:33:23Z'
  result: |-
    Promoted build analysis: ACCEPT — no product bugs detected. 7/9 upgrade runs succeeded across all 3 platforms.

    Test result file shows accepted: false due to BO3 logic, but manual analysis of GCS build logs confirms upgrades worked. GCP re-run (Prow 2089440592755953664, jobID 27668155-b67a-418e-a561-274d132d9831) passed with result: SUCCESS, confirming ReportPortal 503 recovery.

    Failure breakdown (9 total runs):
    - 7/9 upgrades SUCCEEDED (verified via GCS build logs) — all marked "failure" solely because send-results-to-reportportal post-step hit datarouter.ccitredhat.com 503.
    - 2/9 had etcd operator degradation on source clusters (AWS Run 3 on 4.12.95, Azure Run 1 on 4.13.69) — known won't-fix issue OCPBUGS-21615/OCPBUGS-2474, never backported to 4.13.

    Platform coverage confirmed:
    - AWS (4.12->4.13.70): 2/3 upgrades succeeded
    - Azure FIPS (4.13.69->4.13.70): 2/3 upgrades succeeded
    - GCP (4.13->4.13.70): 3/3 upgrades succeeded + 1 re-run passed

    ReportPortal 503 outage confirmed temporary by Jayashree (QE lead) and Peter Ruan (pruan, datarouter owner) via Slack. Same failure pattern waived for 4.20.34 release.

    Full analysis: 4.13.70-promoted-build-analysis.md
