  result: |-
    Promoted build 4.16.75 test results aggregated=true, accepted=true. All 3 QE blocking upgrade jobs passed BO3:
    - stable-4.16-upgrade-from-stable-4.15-aws-ipi: failure, success, success (2/3 - PASS)
    - stable-4.16-upgrade-from-stable-4.16-azure-ipi-fips: success (1/1 - PASS)
    - stable-4.16-upgrade-from-stable-4.16-gcp-ipi: success (1/1 - PASS)

    The aws first-attempt failure was CI infrastructure with no product signal: the job died in the pre phase before the cluster was installed, with pod "aws-ipi-f999-ipi-conf-aws-usage-info" pending more than 1h and kubelet reporting "Failed to create pod sandbox: DeadlineExceeded" / "stream terminated by RST_STREAM". Both retries passed cleanly. Same pattern as 4.16.74, where azure failed first and both retries passed.

    No openshift-extended-test suite runs in the stable-build job set (upgrade-only, pass/fail), so the candidate-build operator-install trio is not present here. Gate check PASSED.
