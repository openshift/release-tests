    Candidate build 4.16.0-0.nightly-2026-09-29-195605 (amd64): accepted=false, 4/6 blocking jobs failed BO3. All failures analyzed and WAIVED by release lead (macastil) — none are product bugs:
    - aws-ipi & azure-ipi-fips: test-automation bug. Secondary Scheduler Operator test (OCP-48916/48917) asserts hardcoded CSV version secondaryscheduleroperator.v1.3.2 while shipped operator is v1.3.3; operator installs and reaches phase Succeeded. secondary_scheduler_operator.go:132. Recommend OCPQE ticket to fix hardcoded version. Azure also had a flaky cert-manager OCP-73293 failure (2/3).
