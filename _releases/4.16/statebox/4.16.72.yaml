- name: analyze-candidate-build
  status: Pass
  started_at: '2026-10-01T16:10:52Z'
  completed_at: '2026-10-01T16:10:52Z'
  result: |-
    Candidate build 4.16.0-0.nightly-2026-09-29-195605 (amd64): accepted=false, 4/6 blocking jobs failed BO3. All failures analyzed and WAIVED by release lead (macastil) — none are product bugs:
    - aws-ipi & azure-ipi-fips: test-automation bug. Secondary Scheduler Operator test (OCP-48916/48917) asserts hardcoded CSV version secondaryscheduleroperator.v1.3.2 while shipped operator is v1.3.3; operator installs and reaches phase Succeeded. secondary_scheduler_operator.go:132. Recommend OCPQE ticket to fix hardcoded version. Azure also had a flaky cert-manager OCP-73293 failure (2/3).
    - gcp-ipi & upgrade-from-stable-4.15-gcp-ipi: CI tooling bug (not product). Step cucushift-installer-check-gcp-disktype fails with 'gcloud failed to load ... Python 3.6 no longer supported' (exit 1), failing the pre phase so e2e never runs (hence no test artifacts). ipi-install-install succeeded in both (36m/39m), nodes ready — install works. Recommend OCPQE ticket to update gcloud/Python in that step image.
    Decision: ACCEPT candidate build. Informational track; promoted build 4.16.72 is the gate.
