- issue: 'Infra (non-blocking, QE signal unaffected): f999 jobs report FAILURE only
    because send-results-to-reportportal cannot auth. ''gcloud auth activate-service-account
    --key-file /var/run/datarouter/gcs_sa_openshift-ci-private'' fails all 10 retries
    - the in-cluster datarouter secret still holds the GCS key rotated on 2026-11-25.
    Confirmed on candidate job aws-ipi-disruptive-f999 (2125717576662126592): install
    SUCCESS, openshift-extended-test-disruptive SUCCESS (9 total/0 failures/0 errors/5
    skipped), cluster-health, operators, nodes-readiness, multiarch-validate-nodes
    all SUCCESS; only reportportal FAILURE. The other 8 f999 jobs share the secret
    and will likely fail the same way, making the aggregator mark both builds accepted=false
    on reporting alone. Action: DPTP to refresh the datarouter secret; waive on per-step
    verification.'
  reported_at: '2026-11-26T00:37:45Z'
  resolved: true
  resolution: 'CORRECTION to the original root cause: this is NOT a credential rotation
    and there is nothing for DPTP to refresh. Data Router was shut down with immediate
    effect on 2026-11-18 (RHIDP-18186); DNO-hosted ReportPortal sunsets 2026-11-27
    and KONFLUX-13145 closed with no replacement bridge. RHDH removed their send-data-router
    steps but explicitly left "steps owned by other teams" behind, and openshift-tests-private''s
    send-results-to-reportportal is one of those orphans. Confirmed 2026-11-26 that
    every automated-release-*-f999 job on 4.18/4.19/4.20/4.21 now fails at this step
    with all tests green, so accepted can never be true for any active z-stream until
    the step is removed. Tracked in OCPQE-32124 (Bug, Critical). Reportportal-only
    failures are permanently expected and waivable on per-step verification; do not
    wait for a key rotation or re-trigger.'
  blocker: false
  related_tasks:
  - analyze-candidate-build
  - analyze-promoted-build
  resolved_at: '2026-11-26T13:23:25Z'
- issue: 'LEVEL0 regression, NOT waivable: OCP-74948 "[sig-operators] OLM v1 opeco
    should catalog offer the operator content through https server" fails 6 of 9 runs
    on candidate 4.22.0-0.nightly-2026-11-25-112849, across all 3 platforms (aws 2/3,
    gcp 3/3, azure 1/3). Test fetches the catalogd route https://catalogd-service-openshift-catalogd.apps.<cluster>/catalogs/clustercatalog-74948/api/v1/all
    about 20s after ClusterCatalog reports Serving=True, and gets a 14-byte router
    "404 Not Found" -> 0 packages/channels/bundles, failing at olmv1_opeco.go:666.
    Sibling http test OCP-69123 passes. This test PASSED on payload 4.22.0-0.nightly-2026-11-10-072952
    (run 2026-11-16), so it regressed between the Nov-10 and Nov-25 nightlies. No
    matching OCPBUGS exists. The promoted 4.22.24 jobs are upgrade-only and never
    exercise this path. Needs OLM team triage before QE approval.'
  reported_at: '2026-11-26T05:07:55Z'
  resolved: true
  resolution: 'Waived by release lead (jhuttana@redhat.com, 2026-11-26): OCP-74948
    is a known issue that fails inconsistently, not a new product regression. Release
    lead context supersedes the AI regression assessment. Observed 6/9 failures on
    candidate 4.22.0-0.nightly-2026-11-25-112849 with the catalogd route returning
    a router 404; sibling http test OCP-69123 passed throughout, and the promoted
    4.22.24 upgrade jobs do not exercise this path and showed no product failures.
    Note: no OCPBUGS currently tracks this test - worth filing one to make future
    waivers traceable.'
  blocker: true
  related_tasks:
