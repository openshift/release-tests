- issue: 'Re-runs triggered 2026-10-30 for the 2 blocking jobs that failed BO3 on
    infra (not test failures). New runs: GCP upgrade 05ab6af7-2eb5-454a-bf48-60793dfe5da0,
    Azure-FIPS upgrade 6b8ecf29-7803-48a4-acf2-9ce325d14e80. Triggered via `job run
    --upgrade_to quay.io/openshift-release-dev/ocp-release:4.22.21-x86_64`. WARNING:
    do NOT use MCP job_run for these upgrade jobs - it sets RELEASE_IMAGE_LATEST instead
    of RELEASE_IMAGE_TARGET, running a fresh install rather than the upgrade. Prior
    BO3: GCP 1 pass/2 (free slot, a pass gives 2/3); Azure-FIPS 1 pass/3 (exhausted
    - needs jobctl_update_retried_job_run to replace evicted retry ffba9bcc-a84d-410c-afb9-e9e8d8da30c7).
    Root causes: Azure master-2 VM provisioning stall, CI node DiskPressure evictions
    2026-10-29.'
  reported_at: '2026-10-30T09:42:53Z'
  resolved: true
  resolution: SUPERSEDED - BO3 math in this note was wrong. Correct rule (controller.py:710)
    is round((len(retriedJobs)+1.1)/2) over retries only, not a flat 2-of-3. GCP has
    1 retry which PASSED -> threshold 1 -> already PASSING; its re-run 05ab6af7 was
    unnecessary and can be ignored. Only azure-ipi-fips fails (1 success across 2
    retries, needs 2) and is the sole cause of accepted=false. See replacement note
    for the corrected plan.
  blocker: false
  related_tasks:
  - analyze-promoted-build
  resolved_at: '2026-10-30T10:04:12Z'
- issue: 'CORRECTED plan for accepted=false. BO3 rule is round((len(retriedJobs)+1.1)/2)
    over retries only (controller.py:710), NOT a flat 2-of-3. GCP: 1 retry, passed,
    threshold 1 -> ALREADY PASSING, no action needed (re-run 05ab6af7-2eb5-454a-bf48-60793dfe5da0
    was unnecessary, ignore it). AZURE-FIPS is the sole failure: 1 success across
    2 retries, threshold 2. Fix: when re-run 6b8ecf29-7803-48a4-acf2-9ce325d14e80
    passes, run jobctl update-retried-job-run to replace DiskPressure-evicted retry
    ffba9bcc-a84d-410c-afb9-e9e8d8da30c7 with it -> 2 successes/2 retries -> accepted
    flips true. That call also pops aggregated/accepted so the aggregator reprocesses
    (controller.py:992). Requires a running aggregator - the file is aggregated:true
    so it is otherwise skipped (controller.py:841). All original failures were infra,
    zero e2e test failures.'
  reported_at: '2026-10-30T10:04:25Z'
  resolved: false
  resolution: null
  blocker: false
  related_tasks:
  - analyze-promoted-build
