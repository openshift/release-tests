- name: analyze-candidate-build
  status: Pass
  started_at: '2026-10-16T09:45:41Z'
  completed_at: '2026-10-16T09:45:41Z'
  result: |-
    Candidate 4.15.0-0.nightly-2026-10-13-131250 (amd64): aggregated=true, accepted=false. WAIVED by release lead [EMAIL_REDACTED] on 2026-10-16 after JUnit-level root cause analysis. Confidence: High.

    Scope: 6 jobs, 5 clean. Only azure-ipi-fips-f999 failed BO3 (0/3). Each attempt failed ONE different, unrelated test - no test failed twice, so no reproducible regression.

    Root causes from JUnit XML (gs://qe-private-deck/.../azure-ipi-fips-f999):
    1. Attempt 1 (jobID 808249be-3324-41a8-ad76-8e42eb4731ff) OCP-31873 FIO gracePeriod: 'oc get pod -l file-integrity.openshift.io/pod= -n openshift-file-integrity' returned empty list, jsonpath 'array index out of bounds: index 0, length 0' at openshift-tests-private test/extended/securityandcompliance/utils.go:274. Test automation race - no wait before querying operator pod.
    2. Attempt 2 (jobID 63397946-d025-40cc-a9c7-a560ecff8caa) OCP-27733 CSI snapshot: 'oc apply' returned 'Internal error occurred: resource quota evaluation timed out' at volumesnapshot_utils.go:178. Control-plane/API contention; snapshot logic never exercised.
    3. Attempt 3 (jobID 879b6742-6b7d-42c1-8678-b700a2e1aefb) OCP-14697 pod affinity (cucushift): failed on first Given step 'unable to create project (RuntimeError)'. Environmental; test never reached affinity logic.

    Corroborating evidence:
    - Install clean all 3 attempts (junit_install_status.xml: 0 failures).
    - FIPS validation clean all 3 attempts (fips-or-die, fips-check-node-scan: 0 failures) - the FIPS-specific purpose of this lane passed every time.
    - Attempts 2 and 3 started 25s apart (09:31:31Z / 09:31:56Z) and ran concurrently on the same Azure account; both failed with API-contention signatures. Artifact of BO3 firing retries in parallel against shared infra.
    - Precedent: same scatter pattern on azure-ipi-fips in nightly 2026-09-15 (OCP-14522 affinity / compliance 27649 / storage 44910) and on aws-ipi in 2026-09-13; both shipped.
    - No on-point OCPBUGS found for either failure signature - not a tracked product regression.
    - Decisive: promoted build 4.15.70 passed stable-4.15-upgrade-from-stable-4.15-azure-ipi-fips cleanly, first attempt, 0 retries.

    Not one of the three failures reached the feature under test.
