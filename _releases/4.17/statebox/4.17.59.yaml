    all 4 passing runs emitted a testResultSummary (JUnit); all 6 failing runs emitted
    NONE, i.e. zero tests executed. That signature means the jobs died before the
    test suite started (cluster install/provision failure), not product test failures.
    Both failing jobs are AWS; however aws-ipi-disruptive also ran on AWS and passed,
    so it is not a blanket AWS outage. Analysis INCOMPLETE: cannot fetch Prow artifacts
    from gs://qe-private-deck to confirm root cause - gcloud needs reauth (GCS_CRED_FILE
    unset, gsutil returns ''Reauthentication required''). NOTE: this task is informational/non-blocking
    per workflow spec and does NOT gate the release. The shipping payload is 4.17.59,
    whose own test run has accepted=true (analyze-promoted-build=Pass). Caveat: the
    promoted build ran a different, smaller job set (3 upgrade jobs: from-4.16-aws,
    from-4.17-azure-fips, from-4.17-gcp) and did NOT re-run either failing candidate
    job, so the candidate AWS failures remain uncovered by the promoted run.'
