issues:
- issue: 'check-cve-tracker-bug fails with GitLab 404 Project Not Found (reproduced
    twice, not transient). Root cause is NOT specific to 4.17.59: elliott''s get_bug_ids_from_open_shipment_mrs()
    enumerates ALL open MRs in hybrid-platforms/art/ocp-shipment-data and calls gl.get_project(mr.source_project_id)
    on each. Open MR !921 (revert-quay-3-19-shipment) is fork-based with source_project_id=288573,
    which the MCP server''s GITLAB_TOKEN cannot read, so the whole command aborts.
    Our shipment MR !939 is fine (source_project_id == target_project_id == 116177).
    CONSEQUENCE: CVE tracker coverage for 4.17.59 is UNVERIFIED and no missed-tracker
    notification was sent to ART. Remediation: grant MCP server GITLAB_TOKEN read
    access to project 288573, or have ART close/re-target MR !921, or run `oar -r
    4.17.59 check-cve-tracker-bug` from an account with fork access. Task left non-blocking
    per workflow spec.'
