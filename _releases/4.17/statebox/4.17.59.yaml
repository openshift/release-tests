issues:
- issue: 'check-cve-tracker-bug fails with GitLab 404 Project Not Found (reproduced
    twice, not transient). Root cause is NOT specific to 4.17.59: elliott''s get_bug_ids_from_open_shipment_mrs()
    enumerates ALL open MRs in hybrid-platforms/art/ocp-shipment-data and calls gl.get_project(mr.source_project_id)
