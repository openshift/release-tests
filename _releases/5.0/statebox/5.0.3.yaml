    Image health check also COMPLETED successfully: ImageHealthOperator.check_image_health() posted its summary comment to shipment MR 1235 at 2026-11-26T09:08:43Z - "Images scanned: 868. Unhealthy components detected: 0. Health info missed: 0." => unhealthy_count == 0 => healthy. The comment was posted after commit 88d7febb (OCPBUGS-136027 attached at 08:12), so it scanned current shipment content.

    Status restored manually on 2026-11-27. Two tooling defects corrupted this task's state and MUST NOT be mistaken for a real failure:
    (1) At 07:42:40 a trigger run (no -i) hit the "Image consistency check already passed, skipping" early return in cmd_image_consistency_check.trigger_job(). That path emits no "[status]" marker, so cli_result_callback fell through to its default and overwrote Pass -> In Progress, also wiping the stored Prow job ID from task.result.
    (2) At 07:47:46 a status poll with the correct job ID failed because Gangway no longer serves that execution record (OAR saw HTTP 404; a direct GET returns HTTP 500 ~23h after the job ran, while the same-age stage-testing execution c6f91f1d still returns 200). check_job_status treats an unresolvable lookup as a hard Fail, so Pass -> Fail. Do not re-trigger: the job and the health check are both genuinely done.
